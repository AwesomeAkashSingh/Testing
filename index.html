<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dues Ledger</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="wrap">
  <div class="band band-title">
    <header>
      <h1 id="pageTitle">Cards and Benefits</h1>
    </header>
  </div>

  <div class="band band-nav">
    <div class="nav-tabs" id="navTabs">
      <button class="tab active" data-tab="dues">Dues</button>
      <button class="tab" data-tab="debit">Debit cards</button>
      <button class="tab" data-tab="credit">Credit cards</button>
      <button class="tab" data-tab="customised">Customised</button>
      <button class="tab" data-tab="rewards">Rewards</button>
      <button class="tab" data-tab="maintenance">Maintenance</button>
    </div>
  </div>

  <div id="duesSection">
    <div class="band band-filter">
      <div class="stats-wrap"><div class="stats" id="stats"></div></div>
      <div class="person-tabs" id="personTabs" style="margin-top:20px;">
        <button class="person-btn active" data-person="ALL">All</button>
      </div>
    </div>

    <div class="band band-entries">
      <div class="section-label">Entries</div>
      <div id="content" class="loading">Loading dues…</div>
    </div>
  </div>

  <div id="debitSection" class="tab-content band band-nav" style="display:none;"></div>
  <div id="creditSection" style="display:none;">
    <div class="band band-credit">
      <div class="section-label">Credit cards</div>
      <div id="creditCardsTable"></div>
    </div>
  </div>
  
  <div id="customisedSection" class="tab-content" style="display:none;">
    <div class="band band-cust1">
      <div class="section-label">Statement Cycle Tracker</div>
      <div class="person-tabs" id="custBankTabs" style="margin-bottom:24px;">
        <button class="person-btn active" data-bank="ALL">All</button>
      </div>
      <div id="statementCycleGroups"></div>
    </div>
  </div>
  
  <div id="rewardsSection" class="tab-content band band-nav" style="display:none;"></div>

  <div id="maintenanceSection" class="tab-content" style="display:none;">
    <div class="band band-filter">
      <div class="section-label">Tasks</div>
      <div id="maintenanceTasks"></div>
    </div>
    <div class="band band-entries">
      <div class="section-label">Limit check</div>
      <div id="limitCheck"></div>
    </div>
    <div class="band band-recheck">
      <div class="section-label">Entries to re-check or delete from source table</div>
      <div id="recheckEntries"></div>
    </div>
    <div class="band band-stale-check">
      <div class="section-label">Entries to check</div>
      <div id="staleCheckEntries"></div>
    </div>
  </div>

<script src="app.js" defer></script>
</body>
</html>
